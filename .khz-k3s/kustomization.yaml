# The Radio in khz-k3s, carried by Argo CD from unkhz/apps.
# The Radio workflow sets newTag to each image it builds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - radio.yaml
  - cache.yaml
images:
  - name: ghcr.io/unkhz/ikuradio/radio
    newTag: "0cd23de4fb58009efcbddb744815d4006edeaff4"
