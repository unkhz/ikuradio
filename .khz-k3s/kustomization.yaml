# The Radio in khz-k3s, carried by Argo CD from unkhz/apps.
# The Radio workflow sets newTag to each image it builds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - radio.yaml
  - cache.yaml
images:
  - name: ghcr.io/unkhz/ikuradio/radio
    newTag: "557a78c0f4d59fd41dca4e10b1b4294d27b5cc00"
