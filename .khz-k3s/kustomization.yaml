# The Radio in khz-k3s, carried by Argo CD from unkhz/apps.
# The Radio workflow sets newTag to each image it builds.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - radio.yaml
images:
  - name: ghcr.io/unkhz/ikuradio/radio
    newTag: "2302be15ece0d78a7280a0334607c0791f918471"
