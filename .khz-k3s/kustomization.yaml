# The Radio and Throat in khz-k3s, carried by Argo CD from unkhz/apps.
# Each workflow sets newTag for its own image.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - radio.yaml
  - throat.yaml
images:
  - name: ghcr.io/unkhz/ikuradio/radio
    newTag: "9538146cb905595d836195ec9d346beea800aaea"
  - name: ghcr.io/unkhz/ikuradio/throat
    newTag: "latest"
