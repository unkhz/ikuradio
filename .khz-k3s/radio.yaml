# ikuradio's Radio, at ikurad.io. It reads the Archive from the ikuradio
# bucket, and sends Receivers there for Sessions and
# Recordings. The Studio stays on the dev box, writing to the same bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ikuradio-radio
  labels:
    app: ikuradio-radio
spec:
  replicas: 1
  # One Radio keeps one Tactus; two would argue about the time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ikuradio-radio
  template:
    metadata:
      labels:
        app: ikuradio-radio
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: radio
          image: ghcr.io/unkhz/ikuradio/radio:latest
          env:
            - name: SERVER_PORT
              value: "3000"
            - name: ARCHIVE_URL
              value: https://hel1.your-objectstorage.com/ikuradio/
            - name: PUBLIC_ARCHIVE_URL
              value: https://hel1.your-objectstorage.com/ikuradio/
            # the cache of the Songs received (cache.yaml): while its Secret
            # is not there yet, the Radio lists from the Tactus, without search
            - name: CACHE_HOST
              value: ikuradio-cache
            - name: CACHE_DATABASE
              value: songs
            - name: CACHE_USER
              valueFrom:
                secretKeyRef:
                  name: radio.ikuradio-cache.credentials.postgresql.acid.zalan.do
                  key: username
                  optional: true
            - name: CACHE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radio.ikuradio-cache.credentials.postgresql.acid.zalan.do
                  key: password
                  optional: true
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: memory
              mountPath: /song/packages/radio/memory
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # /tactus answers whenever the Radio is on; /pulse is 503 while
          # the Studio is silent, which is the song's trouble, not the pod's
          readinessProbe:
            httpGet:
              path: /tactus
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tactus
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: ikuradio-radio-memory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ikuradio-radio-memory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ikuradio-radio
spec:
  type: ClusterIP
  selector:
    app: ikuradio-radio
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ikuradio-radio
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd"
spec:
  tls:
    - hosts:
        - ikurad.io
      secretName: ikuradio-radio-tls
  rules:
    - host: ikurad.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ikuradio-radio
                port:
                  name: http
---
# ikurad.io is the one host that answers; every other name only sends
# people there. ikuradio.com is redirected by Cloudflare; www is here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ikuradio-to-apex
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?(.*)
    replacement: https://ikurad.io/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ikuradio-www
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd,apps-ikuradio-to-apex@kubernetescrd"
spec:
  tls:
    - hosts:
        - www.ikurad.io
      secretName: ikuradio-www-tls
  rules:
    - host: www.ikurad.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ikuradio-radio
                port:
                  name: http
