# ikuradio's Radio, at ikurad.io. It reads the Archive from the ikuradio
# bucket, and sends Receivers there for Sessions and
# Recordings. The Studio stays on the dev box, writing to the same bucket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ikuradio-radio
  labels:
    app: ikuradio-radio
spec:
  replicas: 1
  # One Radio keeps one Tactus; two would argue about the time
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ikuradio-radio
  template:
    metadata:
      labels:
        app: ikuradio-radio
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      # the Radio's database lies on this node's own disk (the log volume
      # below), so the Radio always runs here
      nodeSelector:
        kubernetes.io/hostname: k3s-agent-medium-gpj
      # the directory Kubernetes makes for the database belongs to root;
      # it is given to the Radio's user before the Radio starts
      initContainers:
        - name: log-owner
          image: busybox:1.37.0
          command: ["sh", "-c", "chown 1000:1000 /log && chmod 750 /log"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
          volumeMounts:
            - name: log
              mountPath: /log
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: radio
          image: ghcr.io/unkhz/ikuradio/radio:latest
          env:
            - name: SERVER_PORT
              value: "3000"
            - name: ARCHIVE_URL
              value: https://hel1.your-objectstorage.com/ikuradio/
            - name: PUBLIC_ARCHIVE_URL
              value: https://hel1.your-objectstorage.com/ikuradio/
            # the cache of the Songs received, for searching them: lost with
            # the pod, and filled again from the Tactus and the Archive
            - name: CACHE_PATH
              value: /cache/songs.sqlite
            # its log of the requests it answers, with no address in it,
            # on the node's own disk, where it outlives every deploy
            - name: LOG_PATH
              value: /song/packages/radio/log/radio.db
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: memory
              mountPath: /song/packages/radio/memory
            - name: cache
              mountPath: /cache
            - name: log
              mountPath: /song/packages/radio/log
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # /tactus answers whenever the Radio is on; /pulse is 503 while
          # the Studio is silent, which is the song's trouble, not the pod's
          readinessProbe:
            httpGet:
              path: /tactus
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tactus
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 10
      volumes:
        - name: memory
          persistentVolumeClaim:
            claimName: ikuradio-radio-memory
        - name: cache
          emptyDir:
            sizeLimit: 64Mi
        - name: log
          hostPath:
            path: /var/lib/ikuradio/log
            type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ikuradio-radio-memory
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ikuradio-radio
spec:
  type: ClusterIP
  selector:
    app: ikuradio-radio
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ikuradio-radio
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd"
spec:
  tls:
    - hosts:
        - ikurad.io
      secretName: ikuradio-radio-tls
  rules:
    - host: ikurad.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ikuradio-radio
                port:
                  name: http
---
# ikurad.io is the one host that answers; every other name only sends
# people there. ikuradio.com is redirected by Cloudflare; www is here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ikuradio-to-apex
spec:
  redirectRegex:
    regex: ^https?://[^/]+/?(.*)
    replacement: https://ikurad.io/${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ikuradio-www
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd,apps-ikuradio-to-apex@kubernetescrd"
spec:
  tls:
    - hosts:
        - www.ikurad.io
      secretName: ikuradio-www-tls
  rules:
    - host: www.ikurad.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ikuradio-radio
                port:
                  name: http
