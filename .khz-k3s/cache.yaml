# The Radio's cache of the Songs received, for searching them (plan
# "Searching the Songs received"): a small Postgres made by the Zalando
# postgres-operator. It is only a cache: the Archive and the Tactus are the
# truth, and the Radio fills it again from them whenever it is empty, so it
# has one instance, a little storage, and no backups.
#
# The operator names it by its team, `ikuradio-`, makes the database `songs`
# owned by the user `radio`, and keeps that user's credentials in the Secret
# radio.ikuradio-cache.credentials.postgresql.acid.zalan.do, which the
# Radio reads. It speaks TLS with a certificate of its own making.
apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: ikuradio-cache
  labels:
    app: ikuradio-cache
spec:
  teamId: ikuradio
  numberOfInstances: 1
  postgresql:
    version: "16"
  volume:
    size: 1Gi
    storageClass: longhorn
  users:
    radio: []
  databases:
    songs: radio
  enableLogicalBackup: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
