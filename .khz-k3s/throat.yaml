# ikuradio's live Chimera playground, at throat.ikurad.io.
# Built from the exact Chimera revision pinned in packages/vocals/lib/throat.ts
# so voice/language issues can be tested interactively against the live engine.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ikuradio-throat
  labels:
    app: ikuradio-throat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ikuradio-throat
  template:
    metadata:
      labels:
        app: ikuradio-throat
    spec:
      imagePullSecrets:
        - name: github-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: throat
          image: ghcr.io/unkhz/ikuradio/throat:latest
          env:
            - name: SERVER_PORT
              value: "3000"
            - name: DIST_DIR
              value: /srv/dist
          ports:
            - name: http
              containerPort: 3000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ikuradio-throat
spec:
  type: ClusterIP
  selector:
    app: ikuradio-throat
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ikuradio-throat
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "apps-cloudflare-only@kubernetescrd"
spec:
  tls:
    - hosts:
        - throat.ikurad.io
      secretName: ikuradio-throat-tls
  rules:
    - host: throat.ikurad.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ikuradio-throat
                port:
                  name: http
