<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Song that never ends</title>
    <style>
      :root {
        --night: #000;
        --words: #fff;
        --chorus: #cfe6ff;
        --weather: #8a8a8a;
        --edge: #6b6b6b;
      }
      body {
        margin: 0;
        padding: 1em 2em 4em;
        background: var(--night);
        color: var(--words);
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: clamp(1.1rem, 3.2vw, 2rem);
        line-height: 1.5;
      }
      #output {
        margin: 0;
        padding: 0;
      }
      p {
        margin: 0 0 1em;
        overflow-wrap: anywhere;
      }
      /* the verses walk; the chorus is the anchor, set a little apart */
      p.chorus {
        color: var(--chorus);
        padding-left: 1.5em;
        border-left: 2px solid #234;
      }
      /* a bridge has no words: only a line of motion while the music carries across */
      p.bridge {
        opacity: 0.35;
        white-space: pre;
        overflow: hidden;
      }
      p.weather {
        color: var(--weather);
        font-style: italic;
      }
      #status {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 0.6em 2em;
        background: linear-gradient(transparent, var(--night) 40%);
        color: var(--edge);
        font-size: 0.55em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status .age {
        color: var(--chorus);
      }
      #controls {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
      }
      #play {
        margin: auto;
        padding: 0.5em 1em;
        font: inherit;
        font-size: 1.5em;
        background: #adf;
        color: #000;
        border: 0 none;
        border-radius: 0.5em;
        cursor: pointer;
      }
      #look-back {
        position: fixed;
        right: 1em;
        bottom: 0.4em;
        z-index: 2;
        font: inherit;
        font-size: 0.55em;
        color: var(--edge);
        background: var(--night);
        border: 1px solid #333;
        border-radius: 0.4em;
        padding: 0.2em 0.6em;
        cursor: pointer;
      }
      #look-back:hover,
      #look-back:focus-visible {
        color: var(--words);
      }
      #status {
        padding-right: 8em;
      }
      /* the diary: every iteration ever sung, newest first */
      #diary {
        position: fixed;
        inset: 0;
        z-index: 3;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.96);
        padding: 1em 2em 3em;
        font-size: 0.7em;
      }
      #diary[hidden] {
        display: none;
      }
      body.looking-back {
        overflow: hidden;
      }
      #diary h2 {
        font-size: 1em;
        font-weight: normal;
        color: var(--chorus);
        margin: 2em 0 0.3em;
        border-top: 1px solid #222;
        padding-top: 1em;
      }
      #diary header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        color: var(--weather);
      }
      #diary button {
        font: inherit;
        color: var(--words);
        background: none;
        border: 1px solid #333;
        border-radius: 0.4em;
        padding: 0.2em 0.8em;
        cursor: pointer;
      }
      #older {
        margin-top: 2em;
      }
      @media (max-width: 600px) {
        body {
          padding: 1em 1em 4em;
        }
        #status {
          padding: 0.6em 7em 0.6em 1em;
        }
        #diary {
          padding: 1em 1em 3em;
        }
      }
    </style>
  </head>
  <body>
    <div id="output"></div>
    <div id="controls">
      <button id="play">Play</button>
    </div>
    <div id="status"></div>
    <button id="look-back" type="button">look back</button>
    <section id="diary" hidden aria-label="The diary">
      <header>
        <span>the diary: every iteration sung to the end, newest first</span>
        <button id="close-diary" type="button" aria-label="Close the diary">
          ×
        </button>
      </header>
      <div id="pages"></div>
      <button id="older" type="button" hidden>older</button>
    </section>
    <a id="end"></a>
    <script src="./index.js"></script>
  </body>
</html>
