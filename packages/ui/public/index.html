<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--meta-->
    <title>ikuradio</title>
    <!--/meta-->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ikuradio" />
    <link rel="preload" href="/fonts/doto.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Doto: letters made of round dots on a grid, like everything else the
         receiver shows. Served by the Radio, under the SIL Open Font License. */
      @font-face {
        font-family: 'Doto';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/doto.woff2') format('woff2');
      }
      :root {
        --night: #05070b;
        --words: #fff;
        --chorus: #cfe6ff;
        --weather: #8a9a94;
        --edge: #5d6b66;
        --glow: #ffb347;
        --hull: #0b1016;
        /* the matrix the page is drawn in: space behind it, its own marks in front */
        --pitch: 6px;
        --seam: #24313c;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--night);
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--words);
        font-family: 'Doto', ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        /* the dots round, not square */
        font-variation-settings: 'ROND' 100;
        font-size: clamp(1rem, 2.8vw, 1.75rem);
        line-height: 1.5;
      }
      /* only the Song being received: its newest words at the bottom, the
         older ones fading out of the top, never scrolled to */
      /* space, behind everything: the page itself is the receiver */
      #space {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      #output,
      #status {
        position: relative;
        z-index: 1;
      }
      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        padding: 3.5rem 2em 0.5em;
        -webkit-mask-image: linear-gradient(transparent, #000 35%);
        mask-image: linear-gradient(transparent, #000 35%);
      }
      p {
        margin: 0 0 1em;
        overflow-wrap: anywhere;
        flex-shrink: 0;
      }
      /* the verses walk; the chorus is the anchor, set a little apart */
      p.chorus {
        color: var(--chorus);
        padding-left: 1.5em;
        background: radial-gradient(circle, #2f4a63 0 1.6px, transparent 2px) 0 0 / var(--pitch) var(--pitch) repeat-y;
      }
      /* a bridge has no words: only a line of motion while the music carries across */
      p.bridge {
        opacity: 0.35;
        white-space: pre;
        overflow: hidden;
      }
      /* the dots have no slant: the weather is told in a dimmer light instead */
      p.weather {
        color: #9aaaa4;
        font-weight: 600;
      }
      /* the edge of the page: the Song, and the iteration as a side note */
      #status {
        flex-shrink: 0;
        padding: 0.5rem 2rem calc(0.6rem + env(safe-area-inset-bottom));
        color: var(--edge);
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status .song {
        color: var(--chorus);
      }
      #status .side {
        font-size: 0.9em;
      }
      #controls {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.2em;
      }
      /* the receiver's likeness and its name, drawn in dots of the same pitch
         as space behind them, only fuller and brighter: in front of it */
      /* drawn on the page's own six-pixel matrix, shown half as large again:
         larger dots, nearer the listener */
      #controls .likeness {
        width: min(78vw, 432px);
        height: auto;
      }
      #controls .name {
        width: min(72vw, 441px);
        height: auto;
        margin-top: -1.2em;
      }
      /* space hushed a little around them, so they stand in front of it */
      #controls::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 34rem 30rem at 50% 50%, rgba(5, 7, 11, 0.82), rgba(5, 7, 11, 0.4) 55%, transparent 80%);
        pointer-events: none;
      }
      /* the one lit switch on the panel: a patch of amber dots, glowing */
      #play {
        margin-top: 0.6em;
        padding: 0.45em 1.3em;
        font: inherit;
        font-size: 1em;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #120b02;
        background:
          radial-gradient(circle, var(--glow) 0 1.35px, transparent 1.75px) 0 0 / 3px 3px,
          #7a4f1a;
        border: 0 none;
        border-radius: 0.5em;
        box-shadow: 0 0 1.6em rgba(255, 179, 71, 0.28);
        cursor: pointer;
        transition: box-shadow 0.3s;
      }
      #play:hover,
      #play:focus-visible {
        box-shadow: 0 0 2.4em rgba(255, 179, 71, 0.5);
        outline: none;
      }
      /* the tuning knob, at the corner: it opens what the receiver knows */
      #knob {
        position: fixed;
        top: 0.7rem;
        right: 0.9rem;
        z-index: 3;
        width: 2.6rem;
        height: 2.6rem;
        padding: 0;
        background: none;
        border: 0 none;
        cursor: pointer;
        color: var(--weather);
      }
      #knob svg {
        width: 100%;
        height: 100%;
        transition: transform 0.4s;
      }
      #knob[aria-expanded='true'] svg {
        transform: rotate(70deg);
      }
      #knob:hover,
      #knob:focus-visible {
        color: var(--glow);
      }
      #panel {
        position: fixed;
        top: 3.6rem;
        right: 0.9rem;
        z-index: 3;
        width: min(24rem, calc(100vw - 1.8rem));
        box-sizing: border-box;
        padding: 1rem 1.1rem;
        background:
          radial-gradient(circle, #141d25 0 1px, transparent 1.4px) 0 0 / var(--pitch) var(--pitch),
          var(--hull);
        border: 2px dotted var(--seam);
        border-radius: 0.8rem 0.2rem 0.8rem 0.8rem;
        font-size: 0.9rem;
        color: var(--weather);
      }
      #panel[hidden] {
        display: none;
      }
      #details {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.9rem;
        margin: 0 0 1rem;
      }
      #details dt {
        color: var(--edge);
      }
      #details dd {
        margin: 0;
        color: var(--chorus);
        overflow-wrap: anywhere;
      }
      #panel nav {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      #panel nav a,
      #panel nav button,
      #songs button {
        font: inherit;
        color: var(--words);
        background: none;
        border: 2px dotted #34434f;
        border-radius: 0.4rem;
        padding: 0.25rem 0.8rem;
        cursor: pointer;
        text-decoration: none;
      }
      #panel nav a[hidden] {
        display: none;
      }
      /* every Song received, newest first, opened over the receiver */
      #songs {
        width: min(40rem, calc(100vw - 2rem));
        max-height: min(40rem, calc(100dvh - 4rem));
        box-sizing: border-box;
        padding: 1rem 1.2rem;
        background:
          radial-gradient(circle, #141d25 0 1px, transparent 1.4px) 0 0 / var(--pitch) var(--pitch),
          var(--hull);
        color: var(--weather);
        border: 2px dotted var(--seam);
        border-radius: 0.8rem;
        font-size: 0.9rem;
        overflow: hidden;
      }
      #songs::backdrop {
        background: rgba(0, 0, 0, 0.75);
      }
      #songs header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
      }
      /* a window onto the Songs: never scrolled, only moved, a slice at a time */
      #song-window {
        position: relative;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: contain;
      }
      #song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #song-list li {
        height: 52px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #song-list li.unknown {
        color: var(--edge);
        padding: 0.5rem 0.2rem;
        border-top: 2px dotted #1a242d;
      }
      #song-list a {
        display: block;
        height: 100%;
        box-sizing: border-box;
        padding: 0.5rem 2.6rem 0.5rem 0.2rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-top: 2px dotted #1a242d;
        color: var(--chorus);
        text-decoration: none;
      }
      #song-list a:hover,
      #song-list a:focus-visible {
        background: #111921;
      }
      #song-list .mood {
        display: block;
        color: var(--weather);
        font-size: 0.9em;
      }
      #songs .pager {
        position: absolute;
        right: 0.2rem;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: var(--hull);
        opacity: 0.85;
      }
      #songs .pager:disabled {
        opacity: 0.25;
        cursor: default;
      }
      #page-up {
        top: 0.3rem;
      }
      #page-down {
        bottom: 0.3rem;
      }
      @media (max-width: 600px) {
        #output {
          padding: 3.5rem 1em 0.5em;
        }
        #status {
          padding: 0.5rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div id="output"></div>
    <div id="status"></div>
    <div id="controls">
      <img class="likeness" src="/receiver.svg" width="288" height="288" alt="A lost receiver, a little broken" />
      <img class="name" src="/wordmark.svg" width="294" height="54" alt="ikuradio" />
      <button id="play" type="button">switch on</button>
    </div>
    <button id="knob" type="button" aria-label="What the receiver knows" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
        <g><circle cx="32.0" cy="22.0" r="1.5"/><circle cx="31.2" cy="26.2" r="1.5"/><circle cx="28.8" cy="29.8" r="1.5"/><circle cx="25.2" cy="32.2" r="1.5"/><circle cx="21.0" cy="33.0" r="1.5"/><circle cx="16.8" cy="32.2" r="1.5"/><circle cx="13.2" cy="29.8" r="1.5"/><circle cx="10.8" cy="26.2" r="1.5"/><circle cx="10.0" cy="22.0" r="1.5"/><circle cx="10.8" cy="17.8" r="1.5"/><circle cx="13.2" cy="14.2" r="1.5"/><circle cx="16.8" cy="11.8" r="1.5"/><circle cx="21.0" cy="11.0" r="1.5"/><circle cx="25.2" cy="11.8" r="1.5"/><circle cx="28.8" cy="14.2" r="1.5"/><circle cx="31.2" cy="17.8" r="1.5"/></g>
        <g opacity="0.6"><circle cx="6.3" cy="30.5" r="1"/><circle cx="4.0" cy="22.0" r="1"/><circle cx="6.3" cy="13.5" r="1"/><circle cx="12.5" cy="7.3" r="1"/><circle cx="21.0" cy="5.0" r="1"/><circle cx="29.5" cy="7.3" r="1"/></g>
        <g fill="var(--glow)"><circle cx="21.0" cy="22.0" r="1.6"/><circle cx="23.3" cy="19.7" r="1.6"/><circle cx="25.5" cy="17.5" r="1.6"/><circle cx="27.8" cy="15.2" r="1.9"/></g>
      </svg>
    </button>
    <section id="panel" hidden aria-label="What the receiver knows">
      <dl id="details"></dl>
      <nav>
        <button id="open-songs" type="button">songs</button>
        <a id="live" href="/" hidden>tune to live</a>
      </nav>
    </section>
    <dialog id="songs" aria-label="Songs received">
      <header>
        <span>every Song received, newest first</span>
        <button id="close-songs" type="button" aria-label="Close">×</button>
      </header>
      <div id="song-window">
        <ul id="song-list"></ul>
        <button id="page-up" class="pager" type="button" aria-label="Newer Songs">▲</button>
        <button id="page-down" class="pager" type="button" aria-label="Older Songs">▼</button>
      </div>
    </dialog>
    <script type="module" src="/space.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
