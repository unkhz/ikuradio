<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--meta-->
    <title>ikuradio</title>
    <!--/meta-->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#05070b" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ikuradio" />
    <link rel="preload" href="/fonts/doto.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Doto: letters made of round dots on a grid, like everything else the
         receiver shows. Served by the Radio, under the SIL Open Font License. */
      @font-face {
        font-family: 'Doto';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/doto.woff2') format('woff2');
      }
      :root {
        --night: #05070b;
        --words: #fff;
        --chorus: #cfe6ff;
        --weather: #8a9a94;
        --edge: #5d6b66;
        --glow: #ffb347;
        --hull: #0b1016;
        /* the matrix the page is drawn in: space behind it, its own marks in front */
        --pitch: 6px;
        --seam: #24313c;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--night);
      }
      body {
        display: flex;
        flex-direction: column;
        color: var(--words);
        font-family: 'Doto', ui-monospace, Menlo, Consolas, monospace;
        font-weight: 700;
        /* the dots round, not square */
        font-variation-settings: 'ROND' 100;
        font-size: clamp(1rem, 2.8vw, 1.75rem);
        line-height: 1.5;
      }
      /* only the Song being received: its newest words at the bottom, the
         older ones fading out of the top, never scrolled to */
      /* space, behind everything: the page itself is the receiver */
      #space {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
      }
      #output,
      #status {
        position: relative;
        z-index: 1;
      }
      #output {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        overflow: hidden;
        padding: 3.5rem 2em 0.5em;
        -webkit-mask-image: linear-gradient(transparent, #000 35%);
        mask-image: linear-gradient(transparent, #000 35%);
      }
      p {
        margin: 0 0 1em;
        overflow-wrap: anywhere;
        flex-shrink: 0;
      }
      /* the end of a line ends its row, unless the line wrapped and left its
         last row short: then the next line runs on after it, a little apart */
      .seam {
        display: block;
      }
      .seam.run {
        display: inline;
        word-spacing: 0.6em;
      }
      /* the verses walk; the chorus is the anchor, set a little apart */
      p.chorus {
        color: var(--chorus);
        padding-left: 1.5em;
        background: radial-gradient(circle, #2f4a63 0 1.6px, transparent 2px) 0 0 / var(--pitch) var(--pitch) repeat-y;
      }
      /* a bridge has no words: only a line of motion while the music carries across */
      p.bridge {
        opacity: 0.35;
        white-space: pre;
        overflow: hidden;
      }
      /* a DJ's words, typed as the Song's are, but in the warm of the receiver's antenna, with a
         rule of amber dots where the chorus has blue ones; they scroll up and away once the Song begins */
      p.dj {
        color: var(--glow);
        max-width: calc(100% - var(--rezzy-room, 0px));
        padding-left: 1.5em;
        background: radial-gradient(circle, #8a5f22 0 1.6px, transparent 2px) 0 0 / var(--pitch) var(--pitch) repeat-y;
      }
      p.dj .unsaid {
        visibility: hidden;
      }
      /* the dots have no slant: the weather is told in a dimmer light instead */
      p.weather {
        color: #9aaaa4;
        font-weight: 600;
      }
      /* the edge of the page: the Song, and the iteration as a side note */
      /* a DJ, while a Song's intro plays: drawn in the same dots as the page */
      #rezzy {
        position: fixed;
        right: 1.5rem;
        bottom: calc(3.4rem + env(safe-area-inset-bottom));
        z-index: 2;
        pointer-events: none;
      }
      #status {
        flex-shrink: 0;
        padding: 0.5rem 2rem calc(0.6rem + env(safe-area-inset-bottom));
        color: var(--edge);
        /* a slight dark shadow, so the words read over the dots behind and Rezzy in front */
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(0, 0, 0, 0.85), 0 0 8px rgba(0, 0, 0, 0.6);
        font-size: 0.95rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #status .song {
        color: var(--chorus);
      }
      #status .encore {
        color: var(--glow);
        font-size: 0.9em;
        letter-spacing: 0.05em;
      }
      #status .side {
        font-size: 0.9em;
      }
      /* where a Song heard again has ended: the two ways to carry on */
      #status .carry {
        font: inherit;
        color: var(--words);
        background: none;
        border: 2px dotted #34434f;
        border-radius: 0.4rem;
        min-height: 44px;
        padding: 0.25rem 0.9rem;
        margin-right: 0.6rem;
        cursor: pointer;
      }
      #controls {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.2em;
      }
      /* the receiver's likeness and its name: always one above the other,
         whatever else moves around them */
      #brand {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      /* the receiver's likeness and its name, drawn in dots of the same pitch
         as space behind them, only fuller and brighter: in front of it */
      /* drawn on the page's own six-pixel matrix, shown half as large again:
         larger dots, nearer the listener; the pair's whole box shrinks on a
         short screen, so the play button always fits above the fold */
      #controls .likeness {
        width: min(78vw, 432px, 55vh);
        height: auto;
      }
      #controls .name {
        width: min(72vw, 441px, 52vh);
        height: auto;
        margin-top: -1.2em;
      }
      /* the tuning: the Song offered in smaller print, and the button that plays it */
      #tune {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #offered {
        margin: 0;
        max-width: min(90vw, 34rem);
        color: var(--chorus);
        font-size: 0.85em;
        font-weight: 600;
        overflow-wrap: anywhere;
        text-align: center;
      }
      /* space hushed a little around them, so they stand in front of it */
      #controls::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background: radial-gradient(ellipse 34rem 30rem at 50% 50%, rgba(5, 7, 11, 0.82), rgba(5, 7, 11, 0.4) 55%, transparent 80%);
        pointer-events: none;
      }
      /* the one lit switch on the panel: a patch of amber dots, glowing */
      #play {
        margin-top: 0.6em;
        padding: 0.45em 1.3em;
        font: inherit;
        font-size: 1em;
        font-weight: 900;
        letter-spacing: 0.02em;
        color: #120b02;
        background:
          radial-gradient(circle, var(--glow) 0 1.35px, transparent 1.75px) 0 0 / 3px 3px,
          #7a4f1a;
        border: 0 none;
        border-radius: 0.5em;
        box-shadow: 0 0 1.6em rgba(255, 179, 71, 0.28);
        cursor: pointer;
        transition: box-shadow 0.3s;
      }
      #play:hover,
      #play:focus-visible {
        box-shadow: 0 0 2.4em rgba(255, 179, 71, 0.5);
        outline: none;
      }
      /* the tuning knob, at the corner: it opens what the receiver knows */
      #knob {
        position: fixed;
        top: 0.7rem;
        right: 0.9rem;
        z-index: 3;
        width: 2.6rem;
        height: 2.6rem;
        padding: 0;
        background: none;
        border: 0 none;
        cursor: pointer;
        color: var(--weather);
      }
      #knob svg {
        width: 100%;
        height: 100%;
        transition: transform 0.4s;
      }
      #knob[aria-expanded='true'] svg {
        transform: rotate(70deg);
      }
      #knob:hover,
      #knob:focus-visible {
        color: var(--glow);
      }
      #panel {
        position: fixed;
        top: 3.6rem;
        right: 0.9rem;
        z-index: 3;
        width: min(24rem, calc(100vw - 1.8rem));
        box-sizing: border-box;
        padding: 1rem 1.1rem;
        background:
          radial-gradient(circle, #141d25 0 1px, transparent 1.4px) 0 0 / var(--pitch) var(--pitch),
          var(--hull);
        border: 2px dotted var(--seam);
        border-radius: 0.8rem 0.2rem 0.8rem 0.8rem;
        font-size: 0.9rem;
        color: var(--weather);
      }
      #panel[hidden] {
        display: none;
      }
      #details {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.9rem;
        margin: 0 0 1rem;
      }
      #details dt {
        color: var(--edge);
      }
      #details dd {
        margin: 0;
        color: var(--chorus);
        overflow-wrap: anywhere;
      }
      /* what the mind thought of the Song, last, in its own words */
      #thought {
        margin: 0 0 1rem;
      }
      #thought[hidden] {
        display: none;
      }
      #thought figcaption {
        color: var(--edge);
        margin-bottom: 0.25rem;
      }
      #thought p {
        margin: 0;
        color: var(--words);
        overflow-wrap: anywhere;
      }
      #panel nav {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }
      #panel nav a,
      #panel nav button,
      #songs button {
        font: inherit;
        color: var(--words);
        background: none;
        border: 2px dotted #34434f;
        border-radius: 0.4rem;
        padding: 0.25rem 0.8rem;
        cursor: pointer;
        text-decoration: none;
      }
      #panel nav [aria-pressed='true'] {
        color: var(--chorus);
      }
      #panel nav a[hidden],
      #panel nav button[hidden] {
        display: none;
      }
      /* every Song received, newest first, opened over the receiver */
      #songs {
        width: min(40rem, calc(100vw - 2rem));
        max-height: min(40rem, calc(100dvh - 4rem));
        box-sizing: border-box;
        padding: 1rem 1.2rem;
        background:
          radial-gradient(circle, #141d25 0 1px, transparent 1.4px) 0 0 / var(--pitch) var(--pitch),
          var(--hull);
        color: var(--weather);
        border: 2px dotted var(--seam);
        border-radius: 0.8rem;
        font-size: 0.9rem;
        overflow: hidden;
      }
      #songs::backdrop {
        background: rgba(0, 0, 0, 0.75);
      }
      #songs header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.6rem;
      }
      /* the search: two filters, stacked on a phone, side by side on a wide screen */
      #song-search {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 0.5rem;
      }
      #song-search[hidden],
      #song-found[hidden] {
        display: none;
      }
      #song-search label {
        display: grid;
        gap: 0.15rem;
      }
      #song-search span {
        color: var(--edge);
        font-size: 0.8em;
      }
      #song-search select {
        width: 100%;
        min-height: 44px;
        box-sizing: border-box;
        font: inherit;
        color: var(--words);
        background: var(--hull);
        border: 2px dotted #34434f;
        border-radius: 0.4rem;
        padding: 0.3rem 0.5rem;
      }
      @media (min-width: 600px) {
        #song-search {
          grid-template-columns: 1fr 1fr;
        }
      }
      /* what the search shows, each part with its own way out */
      #song-found {
        margin: 0 0 0.5rem;
        color: var(--chorus);
      }
      #songs #song-found button {
        border: none;
        padding: 0 0.3rem;
        min-width: 1.6rem;
        min-height: 1.6rem;
        color: var(--edge);
      }
      #songs #song-found button.clear {
        border: 2px dotted #34434f;
        margin-left: 0.4rem;
        padding: 0 0.5rem;
      }
      /* a window onto the Songs: never scrolled, only moved, a slice at a time */
      #song-window {
        position: relative;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: contain;
      }
      #song-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #song-list li {
        height: 52px;
        box-sizing: border-box;
        overflow: hidden;
      }
      #song-list li.unknown {
        color: var(--edge);
        padding: 0.5rem 0.2rem;
        border-top: 2px dotted #1a242d;
      }
      #song-list a {
        display: block;
        height: 100%;
        box-sizing: border-box;
        padding: 0.5rem 2.6rem 0.5rem 0.2rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-top: 2px dotted #1a242d;
        color: var(--chorus);
        text-decoration: none;
      }
      #song-list a:hover,
      #song-list a:focus-visible {
        background: #111921;
      }
      #song-list .mood {
        display: block;
        color: var(--weather);
        font-size: 0.9em;
      }
      #songs .pager {
        position: absolute;
        right: 0.2rem;
        width: 2rem;
        height: 2rem;
        padding: 0;
        background: var(--hull);
        opacity: 0.85;
      }
      #songs .pager:disabled {
        opacity: 0.25;
        cursor: default;
      }
      #page-up {
        top: 0.3rem;
      }
      #page-down {
        bottom: 0.3rem;
      }
      /* Promo (hidden, `?promo=<seconds>`): a clean page to record. Nothing
         but the Song shows; at its end the sound and words fade out, and the
         receiver's front page comes up, with where to find it. */
      body.promo #knob,
      body.promo #panel {
        display: none;
      }
      body.promo.outro #status,
      body.promo.outro #rezzy {
        opacity: 0;
        transition: opacity 0.6s;
      }
      body.promo #output {
        transition: opacity 4s linear;
      }
      body.promo.outro #output {
        opacity: 0;
      }
      body.promo.promoted {
        cursor: none;
      }
      #promo {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 1.2em;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        user-select: none;
        transition: opacity 2s ease-in-out, visibility 0s 2s;
      }
      body.promoted #promo {
        opacity: 1;
        visibility: visible;
        transition: opacity 2s ease-in-out;
      }
      body.promoted #status {
        display: none;
      }
      #promo .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #promo .likeness {
        width: min(78vw, 432px, 50vh);
        height: auto;
      }
      #promo .name {
        width: min(72vw, 441px, 47vh);
        height: auto;
        margin-top: -1.2em;
      }
      /* the address, on the one lit patch of amber dots, like the switch it stands in for */
      #promo .address {
        margin: 0.6em 0 0;
        padding: 0.45em 1.3em;
        font-size: 1.15em;
        font-weight: 600;
        color: #120b02;
        background:
          radial-gradient(circle, var(--glow) 0 1.35px, transparent 1.75px) 0 0 / 3px 3px,
          #7a4f1a;
        border-radius: 0.5em;
        box-shadow: 0 0 2em rgba(255, 179, 71, 0.35);
      }
      /* in the last second the address flashes once, to catch the eye */
      body.flash #promo .address {
        animation: flash 1s ease-out 1;
      }
      @keyframes flash {
        0% {
          filter: brightness(1);
          box-shadow: 0 0 2em rgba(255, 179, 71, 0.35);
        }
        25% {
          filter: brightness(1.6);
          box-shadow: 0 0 4.5em rgba(255, 179, 71, 0.95);
        }
        100% {
          filter: brightness(1);
          box-shadow: 0 0 2em rgba(255, 179, 71, 0.35);
        }
      }
      #promo .address b {
        font-weight: 900;
      }
      /* the line above the address, as the front page's offered Song is above its button */
      #promo .tagline {
        margin: 0;
        color: var(--chorus);
        font-size: 0.85em;
        font-weight: 600;
        text-align: center;
      }
      @media (max-width: 600px) {
        #output {
          padding: 3.5rem 1em 0.5em;
        }
        #status {
          padding: 0.5rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
        }
      }
    </style>
  </head>
  <body>
    <canvas id="space" aria-hidden="true"></canvas>
    <div id="output"></div>
    <canvas id="rezzy" width="120" height="114" hidden aria-hidden="true"></canvas>
    <div id="status"></div>
    <div id="controls">
      <div id="brand">
        <img class="likeness" src="/receiver.svg" width="288" height="288" alt="A lost receiver, a little broken" />
        <img class="name" src="/wordmark.svg" width="294" height="54" alt="ikuradio" />
      </div>
      <div id="tune">
        <p id="offered" hidden></p>
        <button id="play" type="button">tune to live</button>
      </div>
    </div>
    <div id="promo" aria-hidden="true">
      <div class="mark">
        <img class="likeness" src="/receiver.svg" width="288" height="288" alt="" />
        <img class="name" src="/wordmark.svg" width="294" height="54" alt="" />
      </div>
      <p class="tagline">the song that never ends</p>
      <p class="address">listen on <b>ikurad.io</b></p>
    </div>
    <button id="knob" type="button" aria-label="What the receiver knows" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 40 40" fill="currentColor" aria-hidden="true">
        <g><circle cx="32.0" cy="22.0" r="1.5"/><circle cx="31.2" cy="26.2" r="1.5"/><circle cx="28.8" cy="29.8" r="1.5"/><circle cx="25.2" cy="32.2" r="1.5"/><circle cx="21.0" cy="33.0" r="1.5"/><circle cx="16.8" cy="32.2" r="1.5"/><circle cx="13.2" cy="29.8" r="1.5"/><circle cx="10.8" cy="26.2" r="1.5"/><circle cx="10.0" cy="22.0" r="1.5"/><circle cx="10.8" cy="17.8" r="1.5"/><circle cx="13.2" cy="14.2" r="1.5"/><circle cx="16.8" cy="11.8" r="1.5"/><circle cx="21.0" cy="11.0" r="1.5"/><circle cx="25.2" cy="11.8" r="1.5"/><circle cx="28.8" cy="14.2" r="1.5"/><circle cx="31.2" cy="17.8" r="1.5"/></g>
        <g opacity="0.6"><circle cx="6.3" cy="30.5" r="1"/><circle cx="4.0" cy="22.0" r="1"/><circle cx="6.3" cy="13.5" r="1"/><circle cx="12.5" cy="7.3" r="1"/><circle cx="21.0" cy="5.0" r="1"/><circle cx="29.5" cy="7.3" r="1"/></g>
        <g fill="var(--glow)"><circle cx="21.0" cy="22.0" r="1.6"/><circle cx="23.3" cy="19.7" r="1.6"/><circle cx="25.5" cy="17.5" r="1.6"/><circle cx="27.8" cy="15.2" r="1.9"/></g>
      </svg>
    </button>
    <section id="panel" hidden aria-label="What the receiver knows">
      <dl id="details"></dl>
      <figure id="thought" hidden>
        <figcaption>the mind</figcaption>
        <p></p>
      </figure>
      <nav>
        <button id="open-songs" type="button">songs</button>
        <a id="live" href="/" hidden>tune to live</a>
        <button id="autoplay" type="button" aria-pressed="false" hidden>autoplay</button>
      </nav>
    </section>
    <dialog id="songs" aria-label="Songs received">
      <header>
        <span>every Song received, newest first</span>
        <button id="close-songs" type="button" aria-label="Close">×</button>
      </header>
      <form id="song-search" hidden>
        <label><span>mode</span><select id="search-mode" name="mode"></select></label>
        <label><span>heard</span><select id="search-heard" name="heard"></select></label>
      </form>
      <p id="song-found" hidden></p>
      <div id="song-window">
        <ul id="song-list"></ul>
        <button id="page-up" class="pager" type="button" aria-label="Newer Songs">▲</button>
        <button id="page-down" class="pager" type="button" aria-label="Older Songs">▼</button>
      </div>
    </dialog>
    <script type="module" src="/space.js"></script>
    <script src="/verses.js"></script>
    <script src="/dj.js"></script>
    <script src="/index.js"></script>
  </body>
</html>
