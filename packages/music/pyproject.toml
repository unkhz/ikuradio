[project]
name = "music"
version = "0.1.0"
description = "The bed under the voice: MusicGen, listening to the Vocals and the Mood"
requires-python = "==3.12.*"
dependencies = [
  "av>=14",
  "numpy>=2",
  "soundfile>=0.13",
  "torch>=2.8",
  # the processor hears the voice as chroma through torchaudio
  "torchaudio>=2.8",
  "transformers>=4.57",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
