version: '3'
tasks:
  dev:
    desc: Run in development mode
    cmds:
      - npx tsx index.ts
  rehearse:
    desc: Sing one iteration into a single take, without the server
    deps:
      - :vocals:build
    cmds:
      - npx tsx rehearse.ts {{.CLI_ARGS}}
  lint:
    desc: Run static analysis
    cmds:
      - npx tsc --noEmit
  test:
    desc: Run tests
    cmds:
      - npx jest
