# Root Taskfile.yml
version: '3'

dotenv:
  - .env.local
  - .env

includes:
  cli:
    taskfile: packages/cli/Taskfile.yaml
    dir: packages/cli
  server:
    taskfile: packages/server/Taskfile.yaml
    dir: packages/server
  song:
    taskfile: packages/song/Taskfile.yaml
    dir: packages/song
  tools:
    taskfile: packages/tools/Taskfile.yaml
    dir: packages/tools
  ui:
    taskfile: packages/ui/Taskfile.yaml
    dir: packages/ui
  vocals:
    taskfile: packages/vocals/Taskfile.yaml
    dir: packages/vocals
  melody:
    taskfile: packages/melody/Taskfile.yaml
    dir: packages/melody
  mood:
    taskfile: packages/mood/Taskfile.yaml
    dir: packages/mood

tasks:
  lint-all:
    desc: Lint all packages
    deps:
      - cli:lint
      - server:lint
      - song:lint
      - melody:lint
      - mood:lint
      - vocals:lint
      - tools:lint

  test-all:
    desc: Test all packages
    deps:
      - cli:test
      - server:test
      - song:test
      - melody:test
      - mood:test
      - vocals:test
      - tools:test
      - ui:test

  container:build:
    desc: Build the song a body, a container image that sings anywhere
    cmds:
      - docker build -t song-that-never-ends .

  container:run:
    desc: Wake the song in its body, in the background, with its diary in a volume
    cmds:
      - >-
        docker run -d --restart unless-stopped --name song-that-never-ends
        -p {{.SERVER_PORT | default "3000"}}:3000
        -v song-that-never-ends-memory:/song/packages/server/memory
        -e LYRICS_MODEL -e ITERATION_COUNT -e MOOD_COUNT -e CHOIR_COUNT -e VARIATION_COUNT
        {{if .OLLAMA_HOST}}-e OLLAMA_HOST{{end}}
        song-that-never-ends

  container:logs:
    desc: Read what the song says about itself
    cmds:
      - docker logs -f song-that-never-ends

  container:stop:
    desc: Let the song rest; its diary stays in the volume
    cmds:
      - docker rm -f song-that-never-ends
