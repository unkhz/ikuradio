# Root Taskfile.yml
version: '3'

dotenv:
  - .env.local
  - .env

includes:
  cli:
    taskfile: packages/cli/Taskfile.yaml
    dir: packages/cli
  server:
    taskfile: packages/server/Taskfile.yaml
    dir: packages/server
  song:
    taskfile: packages/song/Taskfile.yaml
    dir: packages/song
  tools:
    taskfile: packages/tools/Taskfile.yaml
    dir: packages/tools
  ui:
    taskfile: packages/ui/Taskfile.yaml
    dir: packages/ui
  vocals:
    taskfile: packages/vocals/Taskfile.yaml
    dir: packages/vocals
  melody:
    taskfile: packages/melody/Taskfile.yaml
    dir: packages/melody
  mood:
    taskfile: packages/mood/Taskfile.yaml
    dir: packages/mood

tasks:
  lint-all:
    desc: Lint all packages
    deps:
      - cli:lint
      - server:lint
      - song:lint
      - melody:lint
      - mood:lint
      - vocals:lint
      - tools:lint

  test-all:
    desc: Test all packages
    deps:
      - cli:test
      - server:test
      - song:test
      - melody:test
      - mood:test
      - vocals:test
      - tools:test
      - ui:test
