<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 392" width="880" height="392" role="img" aria-labelledby="hl-title hl-desc">
  <title id="hl-title">ikuradio High-Level Architecture</title>
  <desc id="hl-desc">Heart and Studio produce each Song on a GPU, Archive stores Sessions and beds forever, Radio keeps the shared Tactus clock, and Browser Receivers synthesize voices and mix audio live.</desc>
  <defs>
    <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#1e2736"/>
    </pattern>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ffb347"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7aa2c4"/>
    </marker>
    <marker id="arrowMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9ec4b0"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8b97ab"/>
    </marker>
    <style>
      .bg { fill: #0c0f15; }
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #eef2f6; }
      .nodeTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #eef2f6; }
      .nodeSub { font: 600 13.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .item { font: 400 14.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #c2ccd9; }
      .edgeLabel { font: 500 13.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="392" rx="14" class="bg"/>
  <rect width="880" height="392" rx="14" fill="url(#dotGrid)"/>
  <rect x="1" y="1" width="878" height="390" rx="13" fill="none" stroke="#222b3a" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="40" cy="40" r="5.5" fill="#ffb347"/>
  <circle cx="40" cy="40" r="11" fill="#ffb347" opacity="0.18"/>
  <text x="62" y="47" class="title">High-Level System Architecture</text>

  <!-- 1. Heart & Studio -->
  <rect x="28" y="76" width="182" height="190" rx="12" fill="#131926" stroke="#ffb347" stroke-opacity="0.65" stroke-width="1.8"/>
  <text x="119" y="108" text-anchor="middle" class="nodeTitle">1. Studio</text>
  <text x="119" y="130" text-anchor="middle" class="nodeSub" fill="#ffb347">GPU · Heart</text>
  <line x1="48" y1="146" x2="190" y2="146" stroke="#253045" stroke-width="1"/>
  <text x="119" y="176" text-anchor="middle" class="item">Mind (LLM)</text>
  <text x="119" y="206" text-anchor="middle" class="item">Throat (Chimera)</text>
  <text x="119" y="236" text-anchor="middle" class="item">Band (MusicGen)</text>

  <!-- 2. Archive -->
  <rect x="242" y="76" width="182" height="190" rx="12" fill="#131926" stroke="#7aa2c4" stroke-opacity="0.65" stroke-width="1.8"/>
  <text x="333" y="108" text-anchor="middle" class="nodeTitle">2. Archive</text>
  <text x="333" y="130" text-anchor="middle" class="nodeSub" fill="#7aa2c4">Forever Store</text>
  <line x1="262" y1="146" x2="404" y2="146" stroke="#253045" stroke-width="1"/>
  <text x="333" y="176" text-anchor="middle" class="item">Session JSON</text>
  <text x="333" y="206" text-anchor="middle" class="item">Music beds (.m4a)</text>
  <text x="333" y="236" text-anchor="middle" class="item">Diary &amp; DJ intros</text>

  <!-- 3. Radio -->
  <rect x="456" y="76" width="182" height="190" rx="12" fill="#131926" stroke="#9ec4b0" stroke-opacity="0.65" stroke-width="1.8"/>
  <text x="547" y="108" text-anchor="middle" class="nodeTitle">3. Radio</text>
  <text x="547" y="130" text-anchor="middle" class="nodeSub" fill="#9ec4b0">Stateless k3s</text>
  <line x1="476" y1="146" x2="618" y2="146" stroke="#253045" stroke-width="1"/>
  <text x="547" y="176" text-anchor="middle" class="item">Tactus clock</text>
  <text x="547" y="206" text-anchor="middle" class="item">Song catalog</text>
  <text x="547" y="236" text-anchor="middle" class="item">WASM &amp; UI bundle</text>

  <!-- 4. Receiver -->
  <rect x="670" y="76" width="182" height="190" rx="12" fill="#131926" stroke="#b98cc6" stroke-opacity="0.65" stroke-width="1.8"/>
  <text x="761" y="108" text-anchor="middle" class="nodeTitle">4. Receiver</text>
  <text x="761" y="130" text-anchor="middle" class="nodeSub" fill="#b98cc6">Browser &amp; CLI</text>
  <line x1="690" y1="146" x2="832" y2="146" stroke="#253045" stroke-width="1"/>
  <text x="761" y="176" text-anchor="middle" class="item">Clock sync</text>
  <text x="761" y="206" text-anchor="middle" class="item">WASM voices</text>
  <text x="761" y="236" text-anchor="middle" class="item">Web Audio mix</text>

  <!-- Horizontal Flow Arrows -->
  <line x1="210" y1="171" x2="239" y2="171" stroke="#ffb347" stroke-width="2.4" marker-end="url(#arrowAmber)"/>
  <line x1="424" y1="171" x2="453" y2="171" stroke="#7aa2c4" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <line x1="638" y1="171" x2="667" y2="171" stroke="#9ec4b0" stroke-width="2.4" marker-end="url(#arrowMint)"/>

  <!-- Direct Archive -> Receiver -->
  <path d="M 333 266 L 333 306 L 761 306 L 761 269" fill="none" stroke="#7aa2c4" stroke-width="2.2" marker-end="url(#arrowBlue)"/>
  <rect x="372" y="291" width="350" height="28" rx="6" fill="#10151f" stroke="#2d3b52"/>
  <text x="547" y="310" text-anchor="middle" class="edgeLabel" fill="#9bc2e5">Direct fetch: Session + .m4a beds</text>

  <!-- Radio -> Heart feedback -->
  <path d="M 547 266 L 547 354 L 119 354 L 119 269" fill="none" stroke="#8b97ab" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowSlate)"/>
  <rect x="158" y="340" width="350" height="28" rx="6" fill="#10151f" stroke="#2a3548"/>
  <text x="333" y="359" text-anchor="middle" class="edgeLabel" fill="#9aa8bc">Heart polls /tactus for Songs ahead</text>
</svg>
