<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 564" width="880" height="564" role="img" aria-labelledby="ll-title ll-desc">
  <title id="ll-title">ikuradio Low-Level Song Production Pipeline</title>
  <desc id="ll-desc">How Mood, Tides, Perspectives, and Arrangement guide The Mind to write lyrics, fit syllables to bars, compose a two-voice harmonic guide, produce vocals, MusicGen beds, and procedural synths in parallel, archive the Session, and mix it live in the browser.</desc>
  <defs>
    <pattern id="dotGrid2" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="0.9" fill="#1e2736"/>
    </pattern>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#ffb347"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#7aa2c4"/>
    </marker>
    <marker id="arrMint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#9ec4b0"/>
    </marker>
    <marker id="arrLav" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#b98cc6"/>
    </marker>
    <style>
      .bg { fill: #0c0f15; }
      .title { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #eef2f6; }
      .cardTitle { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #eef2f6; }
      .cardSub { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #aebac9; }
      .highlightSub { font: 500 14.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #9ec4b0; }
      .mixSub { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #cfa9de; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="564" rx="14" class="bg"/>
  <rect width="880" height="564" rx="14" fill="url(#dotGrid2)"/>
  <rect x="1" y="1" width="878" height="562" rx="13" fill="none" stroke="#222b3a" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="40" cy="40" r="5.5" fill="#9ec4b0"/>
  <circle cx="40" cy="40" r="11" fill="#9ec4b0" opacity="0.18"/>
  <text x="62" y="47" class="title">Low-Level Song Production Pipeline</text>

  <!-- ROW 1: DIRECTION & FORM -->
  <rect x="28" y="74" width="258" height="72" rx="10" fill="#131926" stroke="#ffb347" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="157" y="104" text-anchor="middle" class="cardTitle">Mood &amp; Weather</text>
  <text x="157" y="128" text-anchor="middle" class="cardSub">Styles, scenes &amp; band</text>

  <rect x="311" y="74" width="258" height="72" rx="10" fill="#131926" stroke="#ffb347" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="440" y="104" text-anchor="middle" class="cardTitle">Tides &amp; Perspectives</text>
  <text x="440" y="128" text-anchor="middle" class="cardSub">Slow waves &amp; rare twists</text>

  <rect x="594" y="74" width="258" height="72" rx="10" fill="#131926" stroke="#ffb347" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="723" y="104" text-anchor="middle" class="cardTitle">Arrangement</text>
  <text x="723" y="128" text-anchor="middle" class="cardSub">Parts, tempo &amp; mix FX</text>

  <!-- Row 1 -> Row 2 -->
  <line x1="157" y1="146" x2="157" y2="174" stroke="#ffb347" stroke-width="2.2" marker-end="url(#arrAmber)"/>
  <line x1="440" y1="146" x2="440" y2="174" stroke="#ffb347" stroke-width="2.2" marker-end="url(#arrAmber)"/>
  <line x1="723" y1="146" x2="723" y2="174" stroke="#ffb347" stroke-width="2.2" marker-end="url(#arrAmber)"/>

  <!-- ROW 2: WORDS & RHYTHM -->
  <rect x="28" y="178" width="392" height="72" rx="10" fill="#131926" stroke="#7aa2c4" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="224" y="208" text-anchor="middle" class="cardTitle">The Mind (llama.cpp)</text>
  <text x="224" y="232" text-anchor="middle" class="cardSub">Writes lyrics, chorus count &amp; rhymes</text>

  <line x1="420" y1="214" x2="456" y2="214" stroke="#7aa2c4" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <rect x="460" y="178" width="392" height="72" rx="10" fill="#131926" stroke="#7aa2c4" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="656" y="208" text-anchor="middle" class="cardTitle">Bar &amp; Stress Fitting</text>
  <text x="656" y="232" text-anchor="middle" class="cardSub">Syllables set exact section timing</text>

  <!-- Row 2 -> Row 3 -->
  <line x1="440" y1="250" x2="440" y2="278" stroke="#7aa2c4" stroke-width="2.2" marker-end="url(#arrBlue)"/>

  <!-- ROW 3: TWO-VOICE GUIDE -->
  <rect x="28" y="282" width="824" height="68" rx="10" fill="#16222e" stroke="#9ec4b0" stroke-opacity="0.75" stroke-width="1.8"/>
  <text x="440" y="311" text-anchor="middle" class="cardTitle">Two-Voice Harmonic Guide</text>
  <text x="440" y="335" text-anchor="middle" class="highlightSub">Diatonic · Chromatic +/-1 Semitone · Tonicization · Key-Change Pivots</text>

  <!-- Row 3 -> Row 4 Fan-out -->
  <line x1="157" y1="350" x2="157" y2="376" stroke="#9ec4b0" stroke-width="2.2" marker-end="url(#arrMint)"/>
  <line x1="440" y1="350" x2="440" y2="376" stroke="#9ec4b0" stroke-width="2.2" marker-end="url(#arrMint)"/>
  <line x1="723" y1="350" x2="723" y2="376" stroke="#9ec4b0" stroke-width="2.2" marker-end="url(#arrMint)"/>

  <!-- ROW 4: PARALLEL TRACK PRODUCTION -->
  <rect x="28" y="380" width="258" height="72" rx="10" fill="#131926" stroke="#9ec4b0" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="157" y="410" text-anchor="middle" class="cardTitle">Vocals &amp; Choir</text>
  <text x="157" y="434" text-anchor="middle" class="cardSub">Chimera Take scores</text>

  <rect x="311" y="380" width="258" height="72" rx="10" fill="#131926" stroke="#9ec4b0" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="440" y="410" text-anchor="middle" class="cardTitle">MusicGen Beds</text>
  <text x="440" y="434" text-anchor="middle" class="cardSub">Follows hummed guide (.m4a)</text>

  <rect x="594" y="380" width="258" height="72" rx="10" fill="#131926" stroke="#9ec4b0" stroke-opacity="0.6" stroke-width="1.6"/>
  <text x="723" y="410" text-anchor="middle" class="cardTitle">Procedural Synths</text>
  <text x="723" y="434" text-anchor="middle" class="cardSub">Drone, pulse &amp; drums specs</text>

  <!-- Row 4 -> Row 5 -->
  <line x1="157" y1="452" x2="157" y2="476" stroke="#b98cc6" stroke-width="2.2" marker-end="url(#arrLav)"/>
  <line x1="440" y1="452" x2="440" y2="476" stroke="#b98cc6" stroke-width="2.2" marker-end="url(#arrLav)"/>
  <line x1="723" y1="452" x2="723" y2="476" stroke="#b98cc6" stroke-width="2.2" marker-end="url(#arrLav)"/>

  <!-- ROW 5: SESSION & BROWSER MIX -->
  <rect x="28" y="480" width="320" height="68" rx="10" fill="#131926" stroke="#b98cc6" stroke-opacity="0.65" stroke-width="1.6"/>
  <text x="188" y="509" text-anchor="middle" class="cardTitle">Session JSON v1</text>
  <text x="188" y="533" text-anchor="middle" class="cardSub">Immutable Archive + .m4a beds</text>

  <line x1="348" y1="514" x2="380" y2="514" stroke="#b98cc6" stroke-width="2.2" marker-end="url(#arrLav)"/>

  <rect x="384" y="480" width="468" height="68" rx="10" fill="#131926" stroke="#b98cc6" stroke-opacity="0.65" stroke-width="1.6"/>
  <text x="618" y="509" text-anchor="middle" class="cardTitle">Browser Web Audio Mix</text>
  <text x="618" y="533" text-anchor="middle" class="mixSub">WASM synth · pan · filter · reverb · dub echo</text>
</svg>
