name: Radio

# Builds the Radio's image and tunes the cluster to it: the new tag goes into
# .khz-k3s, and Argo CD carries it to ikurad.io.

on:
  push:
    branches: [main]
    paths:
      - packages/radio/**
      - packages/archive/**
      - packages/tools/**
      - packages/ui/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/radio.yaml
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: radio
  cancel-in-progress: false

jobs:
  radio:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Radio
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/radio/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/radio:${{ github.sha }}
            ghcr.io/${{ github.repository }}/radio:latest
          # layers that did not change are not built again
          cache-from: type=gha,scope=radio
          cache-to: type=gha,scope=radio,mode=max

      - name: Tune the cluster to this Radio
        run: |
          sed -i -E "s/^( *newTag:).*/\1 \"${GITHUB_SHA}\"/" .khz-k3s/kustomization.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .khz-k3s/kustomization.yaml
          git commit -m "Tune the Radio to ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
